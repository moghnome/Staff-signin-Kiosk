<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    display:flex;
    min-height:100vh;
}

.left{
    width:50%;
    background:url("{{ url_for('static', filename='Outsideimages.jpg') }}") center center no-repeat;
    background-size:cover;
}

.right{
    width:50%;
    background:linear-gradient(135deg,#c62828,#e53935);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    padding:20px;
}

.logo{
    position:absolute;
    top:20px;
    left:20px;
    width:90px;
}

.box{
    background:white;
    width:100%;
    max-width:340px;
    padding:40px 30px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

h2{
    color:#333;
    margin-bottom:15px;
}

p{
    color:#666;
    margin:8px 0;
}

.timer{
    font-size:13px;
    color:#888;
}

a{
    text-decoration:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    background:#c62828;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#a61c1c;
}

@media(max-width:768px){

    .left{
        display:none;
    }

    .right{
        width:100%;
    }

    .logo{
        width:70px;
    }

    .box{
        max-width:320px;
    }

}

</style>

</head>

<body>

<div class="left"></div>

<div class="right">

<img
    src="{{ url_for('static', filename='logo.png') }}"
    class="logo"
    alt="Logo"
>

<div class="box">

<h2>Thank You</h2>

<p>Please go to <strong>Next Visitor</strong>.</p>

<p class="timer">
This page will automatically return to the Home Page after 30 seconds of inactivity.
</p>

<a href="/returning">
    <button type="button">
        ➡ Next Visitor
    </button>
</a>

<a href="/">
    <button type="button">
        ⬅ Back to Home
    </button>
</a>

</div>

</div>

<script>

let timeout;

function resetTimer(){

    clearTimeout(timeout);

    timeout=setTimeout(function(){

        window.location.href="/";

    },30000);

}

window.addEventListener("load",resetTimer);

document.addEventListener("mousemove",resetTimer);

document.addEventListener("keypress",resetTimer);

document.addEventListener("click",resetTimer);

document.addEventListener("touchstart",resetTimer);

</script>

</body>
</html>
